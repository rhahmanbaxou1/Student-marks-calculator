<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Marks Calculator</title>
</head>

<body>

    <h1>Marks Calculator</h1>

    <label>Student Name:</label>
    <input type="text" id="name">
    <br><br>

    <label>Mathematics:</label>
    <input type="number" id="maths">
    <br><br>

    <label>Accounting:</label>
    <input type="number" id="accounting">
    <br><br>

    <label>Computer Science:</label>
    <input type="number" id="computer">
    <br><br>

    <button onclick="calculateAverage()">
        Calculate Average
    </button>

    <h2 id="output"></h2>

    <script>
        async function calculateAverage() {

            const response = await fetch("/calculate", {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    name: document.getElementById("name").value,
                    maths: document.getElementById("maths").value,
                    accounting: document.getElementById("accounting").value,
                    computer: document.getElementById("computer").value
                })
            });

            const data = await response.json();

            document.getElementById("output").textContent =
                "Student: " + data.name +
                " | Average: " + data.average +
                " | Result: " + data.result;
        }
    </script>

</body>

</html>
